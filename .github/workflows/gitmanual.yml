name: GitManual

on:
  workflow_dispatch:
    inputs:
      rss_url:
        description: "הכנס כתובת RSS של הפודקאסט"
        required: true
        type: string
      episodes_per_run:
        description: "כמה פרקים להוריד"
        required: true
        type: choice
        default: "5"
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"
          - "40"
          - "100"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run script
        env:
          RSS_URL: ${{ inputs.rss_url }}
          EPISODES_PER_RUN: ${{ inputs.episodes_per_run }}
        run: python gitmanual.py

      - name: Load Environment Variables from Python
        run: |
          if [ -f env_output.env ]; then
            cat env_output.env >> $GITHUB_ENV
          fi

      - name: Zip and split podcasts folder dynamically
        run: |
          mkdir -p HEBREW
          COUNT=$(find HEBREW/ -name "*.mp3" 2>/dev/null | wc -l)
          
          # שימוש בשם באנגלית תקינה עבור קובץ ה-ZIP והחלוקה
          SAFE_SLUG="podcast_archive"
          
          # יצירת קובץ ZIP מלא ראשוני
          FULL_ZIP_NAME="${SAFE_SLUG}_${COUNT}.zip"
          zip -r "$FULL_ZIP_NAME" HEBREW/
          
          # בדיקת גודל הקובץ בבתים (1.9GB = בערך 2040109465 בתים)
          FILESIZE=$(stat -c%s "$FULL_ZIP_NAME")
          MAX_SIZE=2040109465 # כ-1.9GB
          
          if [ "$FILESIZE" -gt "$MAX_SIZE" ]; then
            echo "הקובץ חורג מ-1.9GB, מבצע פיצול לחלקים..."
            # פיצול לקבצים בגודל 1.9GB כל אחד
            split -b 1900M "$FULL_ZIP_NAME" "${SAFE_SLUG}_part_"
            
            # הסרת ה-ZIP המקורי הגדול כדי לא להעלות אותו כפול
            rm "$FULL_ZIP_NAME"
            
            # שמירת רשימת החלקים להעלאה ב-Environment Variables
            echo "IS_SPLIT=true" >> $GITHUB_ENV
          else
            echo "ZIP_NAME=$FULL_ZIP_NAME" >> $GITHUB_ENV
            echo "IS_SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create manual-podcast-releases --title "Manual Podcast Episodes Archive" --notes "Accumulated zip archives of manual podcast episodes." || true
          
          if [ "$IS_SPLIT" = "true" ]; then
            echo "מעלה חלקים מפוצלים..."
            for part in podcast_archive_part_*; do
              gh release upload manual-podcast-releases "$part" --clobber
            done
          else
            gh release upload manual-podcast-releases "$ZIP_NAME" --clobber
          fi

      - name: Remove large files locally before Git commit
        run: |
          find HEBREW/ -type f -size +45M -exec rm -f {} +

      - name: Save state and files to Git
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gitmanual_seen.json HEBREW/
          git diff --cached --quiet || (
            git commit -m "Update manual podcast episodes and state" && 
            for i in {1..3}; do 
              git push && break || sleep 5; 
            done
          )
