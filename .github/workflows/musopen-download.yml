name: Musopen Downloader

on:
  workflow_dispatch:
    inputs:
      musopen_url:
        description: "Musopen Page URL"
        required: true
        type: string

      release_name:
        description: "Release name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            zip \
            unzip \
            git \
            curl \
            wget \
            python3 \
            python3-pip

      - name: Prepare folders
        shell: bash
        run: |
          set -e

          rm -rf download
          rm -rf release_files

          mkdir -p download
          mkdir -p release_files

      - name: Download audio files from Musopen page
        shell: bash
        env:
          TARGET_URL: ${{ inputs.musopen_url }}
        run: |
          set -e

          cd download

          # שימוש ב-wget לסריקת הדף והורדת קבצי השמע (MP3) המקושרים אליו
          wget \
            --recursive \
            --no-parent \
            --accept=mp3 \
            --reject="index.html*" \
            --no-directories \
            "$TARGET_URL" || true

      - name: Verify downloaded files
        shell: bash
        run: |
          set -e

          if ! find download -type f | grep -q .; then
            echo "ERROR: No files were downloaded."
            exit 1
          fi

          find download -type f -printf '%p - %s bytes\n'

      - name: Package download
        shell: bash
        run: |
          set -e

          zip -r \
            "release_files/musopen-download.zip" \
            download

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -e

          gh release create \
            "musopen-${GITHUB_RUN_ID}" \
            release_files/* \
            --title "$RELEASE_NAME" \
            --notes ""
