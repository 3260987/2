- name: Download audio files from Musopen page
        shell: bash
        env:
          TARGET_URL: ${{ inputs.musopen_url }}
        run: |
          set -e

          cd download

          python3 - << 'EOF'
          import os
          import urllib.request
          import urllib.parse
          import re
          import json
          import urllib.error

          url = os.environ['TARGET_URL']
          req = urllib.request.Request(
              url,
              headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  html_content = response.read().decode('utf-8')
          except Exception as e:
              print(f"Error fetching URL: {e}")
              exit(1)

          # חיפוש קישורים לקבצי MP3 בדף
          mp3_links = re.findall(r'href="([^"]+\.mp3[^"]*)"', html_content)
          
          # ניקוי כתובות כפולות
          mp3_links = list(set(mp3_links))
          
          print(f"Found {len(mp3_links)} MP3 links.")

          for link in mp3_links:
              full_url = urllib.parse.urljoin(url, link)
              filename = os.path.basename(urllib.parse.urlparse(full_url).path)
              print(f"Downloading: {filename}")
              try:
                  urllib.request.urlretrieve(full_url, filename)
              except Exception as e:
                  print(f"Failed to download {full_url}: {e}")
          EOF
