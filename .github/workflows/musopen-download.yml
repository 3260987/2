name: Musopen Download

on:
  workflow_dispatch:
    inputs:
      musopen_url:
        description: "Musopen page URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Download audio files from Musopen page
        shell: bash
        env:
          TARGET_URL: ${{ inputs.musopen_url }}
          DEBUG_DIR: ${{ github.workspace }}/debug
          OUT_DIR: ${{ github.workspace }}/download
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys
          import json
          import urllib.parse
          import requests
          from playwright.sync_api import sync_playwright

          url = os.environ["TARGET_URL"]
          debug_dir = os.environ["DEBUG_DIR"]
          out_dir = os.environ["OUT_DIR"]
          os.makedirs(debug_dir, exist_ok=True)
          os.makedirs(out_dir, exist_ok=True)
          os.chdir(out_dir)

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          )

          found = {}

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              ctx = browser.new_context(user_agent=UA, locale="en-US")
              page = ctx.new_page()

              # 1. Catch network requests dynamically
              def on_response(r):
                  try:
                      ct = r.headers.get("content-type", "")
                      url_lower = r.url.lower()
                      # Catch streams by content-type OR extensions
                      if "audio/" in ct or "mpeg" in ct or re.search(r'\.(mp3|m4a|wav|flac|ogg)(\?|$)', url_lower):
                          found[r.url] = "network"
                  except Exception:
                      pass

              page.on("response", on_response)

              resp = page.goto(url, wait_until="networkidle", timeout=90000)
              print(f"HTTP status: {resp.status if resp else None} - Title: {page.title()}")
              page.wait_for_timeout(3000)

              # 2. Inject JS to hook audio element creations
              page.evaluate("""
                  window._audioUrls = new Set();
                  const origAudio = window.Audio;
                  window.Audio = function(...args) {
                      if(args[0]) window._audioUrls.add(args[0]);
                      return new origAudio(...args);
                  };
                  const origPlay = HTMLMediaElement.prototype.play;
                  HTMLMediaElement.prototype.play = function() {
                      if(this.src) window._audioUrls.add(this.src);
                      return origPlay.apply(this, arguments);
                  };
              """)

              # Scroll down to load elements lazy-loaded by the UI
              for _ in range(5):
                  page.mouse.wheel(0, 2000)
                  page.wait_for_timeout(500)

              # 3. Simulate clicking ALL play buttons on the page to trigger audio network requests
              print("Triggering play buttons to sniff network streams...")
              play_selectors = [
                  "button[class*='play' i]",
                  "a[class*='play' i]",
                  "div[class*='play' i]",
                  "[aria-label*='play' i]",
                  "[title*='play' i]",
                  ".icon-play",
                  ".fa-play"
              ]
              
              for selector in play_selectors:
                  elements = page.locator(selector).all()
                  for el in elements:
                      try:
                          if el.is_visible():
                              el.scroll_into_view_if_needed()
                              # force=True prevents some elements from intercepting clicks
                              el.click(force=True, timeout=1000)
                              page.wait_for_timeout(500)
                      except Exception:
                          pass

              page.wait_for_timeout(3000)

              # 4. Extract URLs from the injected JS hook
              try:
                  hijacked_urls = page.evaluate("Array.from(window._audioUrls)")
                  for u in hijacked_urls:
                      found[urllib.parse.urljoin(url, u)] = "js-hook"
              except Exception as e:
                  print("Hook read error:", e)

              # 5. Extract URLs from standard DOM dataset attributes
              js_dom = "els => els.flatMap(e => [e.href, e.src, e.currentSrc, e.dataset?.src, e.dataset?.url, e.dataset?.file, e.dataset?.audioUrl].filter(Boolean))"
              dom_urls = page.eval_on_selector_all(
                  "a[href], audio, source, [data-src], [data-url], [data-file], [data-audio-url], button", js_dom
              )
              ext_re = re.compile(r"\.(mp3|m4a|ogg|wav|flac)(?:\?|$)", re.I)
              for u in dom_urls:
                  if ext_re.search(u):
                      found[urllib.parse.urljoin(url, u)] = "dom"

              # 6. Final fallback: raw HTML regex matching
              html = page.content()
              html_re = re.compile(r"(https?:[\\/]+[^\"'\s<>\\]+?\.(?:mp3|m4a|ogg|wav|flac)(?:\?[^\"'\s<>\\]*)?)", re.I)
              for m in html_re.findall(html):
                  u = m.replace("\\/", "/")
                  found[urllib.parse.urljoin(url, u)] = "html-regex"

              # Save debug snapshot
              page.screenshot(path=os.path.join(debug_dir, "page.png"), full_page=True)
              with open(os.path.join(debug_dir, "page.html"), "w", encoding="utf-8") as f:
                  f.write(html)

              # Capture Playwright cookies to pass to Requests
              cookies = {c["name"]: c["value"] for c in ctx.cookies()}
              browser.close()

          print(f"\nFound {len(found)} unique audio URLs:")
          for u, src in found.items():
              print(f" - [{src}] {u}")

          if not found:
              print("No audio links found. Check artifacts for page.png debug screenshot.")
              sys.exit(1)

          # 7. Downloading files using robust requests module
          ok = 0
          used = set()
          session = requests.Session()
          session.headers.update({"User-Agent": UA, "Referer": url})
          session.cookies.update(cookies)

          for u in found:
              parsed = urllib.parse.urlparse(u)
              name = urllib.parse.unquote(os.path.basename(parsed.path))
              if not name or not ext_re.search(name):
                  name = "audio.mp3"
              
              base, ext = os.path.splitext(name)
              i = 1
              while name in used or os.path.exists(name):
                  name = f"{base}_{i}{ext}"
                  i += 1
              used.add(name)
              
              print(f"\nDownloading: {name}")
              try:
                  with session.get(u, stream=True, timeout=60) as r:
                      r.raise_for_status()
                      with open(name, "wb") as f:
                          for chunk in r.iter_content(chunk_size=8192):
                              f.write(chunk)
                  ok += 1
                  print("  -> Success")
              except Exception as e:
                  print(f"  -> Failed: {e}")

          print(f"\nCompleted! Downloaded {ok} / {len(found)} files.")
          if ok == 0:
              sys.exit(1)
          EOF

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musopen-debug
          path: debug/
          if-no-files-found: ignore

      - name: Upload downloaded audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musopen-audio
          path: download/
          if-no-files-found: ignore
