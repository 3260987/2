name: Web Downloader - JavaScript Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        default: "https://darknetdiaries.com/"
        type: string
      release_name:
        description: "Release name"
        required: true
        default: "Darknet-Diaries-JS-Test"
        type: string

permissions:
  contents: write

jobs:
  download-and-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          npm install -g single-file-cli

      - name: Capture homepage with JavaScript
        env:
          PAGE_URL: ${{ inputs.url }}
        run: |
          mkdir -p download

          cat > capture_page.py <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = os.environ["PAGE_URL"]

          if not url.startswith(("https://", "http://")):
              raise SystemExit("URL must start with http:// or https://")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1280, "height": 900}
              )

              page.on(
                  "pageerror",
                  lambda error: print("Page JavaScript error:", error)
              )

              response = page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              if response and response.status >= 400:
                  raise SystemExit(
                      f"Website returned HTTP {response.status}"
                  )

              try:
                  page.wait_for_load_state(
                      "networkidle", timeout=15000
                  )
              except Exception:
                  print("Network did not become idle; continuing.")

              page.wait_for_timeout(3000)

              print("Page title:", page.title())
              print("Final URL:", page.url)
              print("JavaScript scripts:", page.locator("script").count())

              browser.close()
          PY

          python capture_page.py

          # Save the page and embed resources with SingleFile.
          single-file "$PAGE_URL" download/Website.html

          test -s download/Website.html

      - name: Verify saved HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          path = Path("download/Website.html")
          data = path.read_text(encoding="utf-8", errors="replace")

          class CheckHTML(HTMLParser):
              pass

          CheckHTML().feed(data)

          print("HTML parsing: OK")
          print("File size:", round(path.stat().st_size / 1024, 1), "KB")
          print("Script tags:", data.lower().count("<script"))
          print("Embedded images:", data.count("data:image/"))

          if len(data) < 100:
              raise SystemExit("Output HTML is unexpectedly small")
          PY

      - name: Create ZIP
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          SAFE_NAME=$(printf '%s' "$RELEASE_NAME" |
            sed 's/[^A-Za-z0-9._-]/_/g')
          [ -n "$SAFE_NAME" ] || SAFE_NAME="Website-JS-Test"

          mkdir -p output
          zip -j "output/${SAFE_NAME}.zip" download/Website.html

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          TAG_NAME="homepage-js-test-${GITHUB_RUN_ID}"

          gh release create "$TAG_NAME" output/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "Single HTML homepage test with JavaScript retained where supported. Extract the ZIP and open Website.html."
