name: Website Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        type: string
        default: "https://darknetdiaries.com/"

      release_name:
        description: "Release name"
        required: true
        type: string
        default: "Downloaded-Website"

permissions:
  contents: write

concurrency:
  group: website-downloader-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Install SingleFile
        run: |
          npm install --global single-file-cli
          single-file --version
          single-file --help

      - name: Find Chromium executable
        id: browser
        shell: bash
        run: |
          set -euo pipefail

          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" \
            -type f \( -path '*/chrome-linux/chrome' \
            -o -path '*/chrome-linux64/chrome' \) \
            -print -quit)"

          if [ -z "$CHROME_PATH" ]; then
            echo "Chromium executable not found."
            exit 1
          fi

          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

      - name: Save website as one HTML file
        shell: bash
        env:
          PAGE_URL: ${{ inputs.url }}
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        run: |
          set -euo pipefail

          mkdir -p output

          single-file "$PAGE_URL" output/Website.html \
            --browser-executable-path="$CHROME_PATH"

          if [ ! -s output/Website.html ]; then
            echo "HTML file was not created."
            exit 1
          fi

          echo "HTML file created:"
          ls -lh output/Website.html

          if ! grep -qi '<html' output/Website.html; then
            echo "The output does not appear to be a complete HTML document."
            exit 1
          fi

      - name: Create ZIP containing only the HTML file
        shell: bash
        run: |
          set -euo pipefail

          cd output
          zip -9 Website.zip Website.html

          echo "ZIP contents:"
          unzip -l Website.zip

          test "$(unzip -Z1 Website.zip | wc -l)" -eq 1
          test "$(unzip -Z1 Website.zip)" = "Website.html"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: website-${{ github.run_number }}
          name: ${{ inputs.release_name }}
          generate_release_notes: false
          files: output/Website.zip
