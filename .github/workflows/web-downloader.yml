name: Website Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        type: string
        default: "https://darknetdiaries.com/"

      max_pages:
        description: "Max pages to save (start small, e.g. 5, then increase)"
        required: true
        type: string
        default: "30"

      include_regex:
        description: "Optional: only follow links matching this regex (e.g. /episode/). Empty = all"
        required: false
        type: string
        default: ""

      block_images:
        description: "Block images (much smaller file)"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

      release_name:
        description: "Release name"
        required: true
        type: string
        default: "Downloaded-Website"

permissions:
  contents: write

concurrency:
  group: website-downloader-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Install SingleFile
        run: |
          npm install --global single-file-cli
          single-file --version

      - name: Find Chromium executable
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" \
            -type f \( -path '*/chrome-linux/chrome' \
            -o -path '*/chrome-linux64/chrome' \) \
            -print -quit)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chromium executable not found."
            exit 1
          fi
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

      - name: Crawl site and build ONE offline HTML file
        shell: bash
        env:
          PAGE_URL: ${{ inputs.url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          INCLUDE_RE: ${{ inputs.include_regex }}
          BLOCK_IMAGES: ${{ inputs.block_images }}
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p output
          python3 crawl_site.py \
            --url "$PAGE_URL" \
            --chrome "$CHROME_PATH" \
            --out output/Website.html \
            --max-pages "$MAX_PAGES" \
            --include "$INCLUDE_RE" \
            --block-images "$BLOCK_IMAGES"
          test -s output/Website.html
          ls -lh output/Website.html

      - name: Create ZIP containing only the HTML file
        shell: bash
        run: |
          set -euo pipefail
          cd output
          zip -9 Website.zip Website.html
          unzip -l Website.zip
          ls -lh Website.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: website-${{ github.run_number }}
          name: ${{ inputs.release_name }}
          generate_release_notes: false
          files: output/Website.zip
