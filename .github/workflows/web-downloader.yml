name: Web Downloader - HTML Viewer Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website homepage URL"
        required: true
        default: "https://darknetdiaries.com/"
        type: string
      release_name:
        description: "Release name"
        required: true
        default: "Darknet-Diaries-Homepage-Test"
        type: string

permissions:
  contents: write

jobs:
  download-and-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Save homepage as one self-contained HTML file
        env:
          PAGE_URL: ${{ inputs.url }}
        run: |
          mkdir -p download

          cat > save_page.py <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = os.environ["PAGE_URL"]

          if not url.startswith(("https://", "http://")):
              raise SystemExit("URL must start with http:// or https://")

          output = Path("download/Website.html")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1280, "height": 900},
                  device_scale_factor=1
              )

              response = page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              if response and response.status >= 400:
                  raise SystemExit(
                      f"Website returned HTTP {response.status}"
                  )

              try:
                  page.wait_for_load_state(
                      "networkidle",
                      timeout=12000
                  )
              except Exception:
                  pass

              page.wait_for_timeout(2000)

              # Inline CSS, images and fonts where possible.
              # The resulting HTML is intended to work offline.
              result = page.evaluate("""async () => {
                const absolute = (u) => {
                  try { return new URL(u, location.href).href; }
                  catch { return ""; }
                };

                const dataUrl = async (url) => {
                  try {
                    const response = await fetch(url);
                    if (!response.ok) return null;
                    const blob = await response.blob();
                    if (blob.size > 2 * 1024 * 1024) return null;

                    return await new Promise((resolve) => {
                      const reader = new FileReader();
                      reader.onload = () => resolve(reader.result);
                      reader.onerror = () => resolve(null);
                      reader.readAsDataURL(blob);
                    });
                  } catch {
                    return null;
                  }
                };

                const clone = document.documentElement.cloneNode(true);

                // Remove scripts so the HTML Viewer does not depend
                // on the original website's JavaScript.
                clone.querySelectorAll(
                  'script, iframe, object, embed'
                ).forEach(el => el.remove());

                // Inline images when same-origin access allows it.
                const originalImages = [...document.images];
                const clonedImages = [...clone.querySelectorAll('img')];

                for (let i = 0; i < clonedImages.length; i++) {
                  const original = originalImages[i];
                  const cloned = clonedImages[i];
                  if (!original || !cloned) continue;

                  const src = original.currentSrc || original.src;
                  if (!src) continue;

                  const embedded = await dataUrl(absolute(src));
                  if (embedded) cloned.setAttribute('src', embedded);

                  cloned.removeAttribute('srcset');
                  cloned.removeAttribute('loading');
                }

                // Inline accessible stylesheets.
                const styles = [...document.styleSheets];
                const cssTexts = [];

                for (const sheet of styles) {
                  try {
                    const rules = [...sheet.cssRules];
                    cssTexts.push(
                      rules.map(rule => rule.cssText).join('\\n')
                    );
                  } catch {
                    // Cross-origin CSS may not be readable.
                  }
                }

                const head = clone.querySelector('head');
                if (head && cssTexts.length) {
                  const style = document.createElement('style');
                  style.textContent = cssTexts.join('\\n');
                  head.appendChild(style);
                }

                // Make links absolute so they still point to the
                // original website if the user has internet access.
                clone.querySelectorAll('a[href]').forEach(a => {
                  a.setAttribute('href', absolute(a.getAttribute('href')));
                });

                return '<!DOCTYPE html>\\n' + clone.outerHTML;
              }""")

              output.write_text(result, encoding="utf-8")
              browser.close()

          if not output.exists() or output.stat().st_size < 100:
              raise SystemExit("HTML output is missing or too small")

          print("Created:", output)
          print("Size:", output.stat().st_size, "bytes")
          PY

          python save_page.py

      - name: Verify HTML
        run: |
          test -s download/Website.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class CheckHTML(HTMLParser):
              pass

          file = Path("download/Website.html")
          CheckHTML().feed(file.read_text(encoding="utf-8"))
          print("HTML parsing passed.")
          print(f"File size: {file.stat().st_size / 1024:.1f} KB")
          PY

      - name: Create ZIP
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          SAFE_NAME=$(printf '%s' "$RELEASE_NAME" |
            sed 's/[^A-Za-z0-9._-]/_/g')
          [ -n "$SAFE_NAME" ] || SAFE_NAME="Homepage-Test"

          mkdir -p output
          zip -j "output/${SAFE_NAME}.zip" download/Website.html

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          TAG_NAME="homepage-test-${GITHUB_RUN_ID}"

          gh release create "$TAG_NAME" \
            output/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "Homepage HTML Viewer compatibility test. Extract the ZIP and open Website.html."
