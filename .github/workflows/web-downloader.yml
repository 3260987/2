name: Web Downloader - HTML with JavaScript Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        default: "https://darknetdiaries.com/"
        type: string
      release_name:
        description: "Release name"
        required: true
        default: "Darknet-Diaries-JS-Test"
        type: string

permissions:
  contents: write

jobs:
  download-and-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          npm install -g single-file-cli

      - name: Save page with JavaScript and embedded resources
        env:
          PAGE_URL: ${{ inputs.url }}
        run: |
          mkdir -p download

          cat > save_page.py <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = os.environ["PAGE_URL"]

          if not url.startswith(("https://", "http://")):
              raise SystemExit("URL must start with http:// or https://")

          output = Path("download/Website.html")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  viewport={"width": 1280, "height": 900}
              )
              page = context.new_page()

              response = page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              if response and response.status >= 400:
                  raise SystemExit(
                      f"Website returned HTTP {response.status}"
                  )

              try:
                  page.wait_for_load_state(
                      "networkidle", timeout=15000
                  )
              except Exception:
                  pass

              page.wait_for_timeout(3000)
              browser.close()
          PY

          python save_page.py

          # SingleFile captures the rendered page and embeds
          # accessible resources while retaining page scripts.
          single-file \
            --browser-executable-path="$(which chromium || which chromium-browser || echo /usr/bin/google-chrome)" \
            --browser-args="--no-sandbox" \
            --browser-wait-until=networkidle \
            --browser-wait-delay=2000 \
            --remove-scripts=false \
            "$PAGE_URL" download/Website.html

          test -s download/Website.html
          ls -lh download/Website.html

      - name: Verify HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          path = Path("download/Website.html")
          data = path.read_text(encoding="utf-8", errors="replace")

          class Check(HTMLParser):
              pass

          Check().feed(data)

          print("HTML parsed successfully")
          print("Size:", round(path.stat().st_size / 1024, 1), "KB")
          print("Script tags:", data.lower().count("<script"))
          print("Embedded images:", data.count("data:image/"))
          PY

      - name: Create ZIP
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          SAFE_NAME=$(printf '%s' "$RELEASE_NAME" |
            sed 's/[^A-Za-z0-9._-]/_/g')
          [ -n "$SAFE_NAME" ] || SAFE_NAME="Website-JS-Test"

          mkdir -p output
          zip -j "output/${SAFE_NAME}.zip" download/Website.html

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          TAG_NAME="homepage-js-test-${GITHUB_RUN_ID}"

          gh release create "$TAG_NAME" output/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "Single-file HTML test with JavaScript retained. Extract the ZIP and open Website.html."
